server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: product-activation-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/default/jwks}
          audiences: ${JWT_AUDIENCE:product-activation-service}
          principal-claim-name: ${JWT_PRINCIPAL_CLAIM:sub}
  task:
    scheduling:
      pool:
        size: 2
      shutdown:
        await-termination: true
        await-termination-period: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

activation:
  api:
    max-request-body-size: ${API_MAX_REQUEST_BODY_SIZE:16KB}
    rate-limit:
      requests-per-minute: ${API_RATE_LIMIT_PER_MINUTE:120}
  processing:
    enabled: ${PROCESSING_ENABLED:true}
    poll-interval: ${PROCESSING_POLL_INTERVAL:1s}
    recovery-interval: ${PROCESSING_RECOVERY_INTERVAL:30s}
    batch-size: ${PROCESSING_BATCH_SIZE:10}
    lease: ${PROCESSING_LEASE:30s}
    max-attempts: ${PROCESSING_MAX_ATTEMPTS:5}
    initial-backoff: ${PROCESSING_INITIAL_BACKOFF:2s}
    max-backoff: ${PROCESSING_MAX_BACKOFF:5m}
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
    api-key: ${PROVIDER_API_KEY:}
